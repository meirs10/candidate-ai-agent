[project]
name = "candidate-ai-agent"
version = "0.1.0"
description = "AI-powered candidate screening agent with RAG and skill-proficiency estimation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # Core agent
    "streamlit",
    "python-dotenv",             # loads .env — the single local secrets file
    "chromadb>=1.0",
    # See requirements.txt: an old opentelemetry-proto ships pre-protoc-3.20
    # generated modules that the modern protobuf runtime refuses at import,
    # killing the app before it starts. Kept in step with requirements.txt.
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-proto>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "protobuf>=5.27",
    # ChromaDB needs sqlite >= 3.35. Some hosted Linux images link Python's
    # stdlib sqlite3 against an older system library, which makes `import
    # chromadb` abort; settings._ensure_modern_sqlite() aliases this wheel over
    # the stdlib name only when that happens. Linux-only: no wheel exists for
    # Windows/macOS and neither hits the problem.
    "pysqlite3-binary; sys_platform == 'linux'",
    "sentence-transformers",
    "ollama",
    "langchain-text-splitters",
    "langchain-ollama",
    "langchain-huggingface",
    "einops",
    # Document parsing
    "PyMuPDF",
    "python-docx",
    "pytesseract",
    "Pillow",
    "unstructured[md,pdf,docx]",
    # The [pdf] extra does NOT reliably pull this in, and without it
    # unstructured.partition.auto raises ModuleNotFoundError on import.
    "unstructured-inference",
    # unstructured imports python-magic for file sniffing. Linux gets libmagic
    # from the OS; Windows ships nothing, and python-magic then loads a missing
    # DLL that pegs a core and dies with an access violation before reading a
    # single document.
    "python-magic-bin; sys_platform == 'win32'",
    # Evaluation
    "ragas",
    "deepeval",
    "pandas",
    "jinja2",
    # SPE dataset generation
    "aiohttp",
    "scikit-learn",
    "scipy",
    "numpy",
    # RAG Fusion
    "rank_bm25",
    # Hosted provider stack (the production default). requests drives the
    # OpenRouter REST backend, including its SSE streaming path.
    "requests",
    "anthropic",
    "voyageai",
    # Skill-proficiency scoring model
    "torch",
    "transformers",
    "coral_pytorch",
    "accelerate",
    "tiktoken",
    "sentencepiece",
    "protobuf",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
markers = [
    "integration: tests that require Ollama or external services (deselect with '-m not integration')",
    "e2e: end-to-end smoke tests with mocked externals",
]
testpaths = ["tests"]
# Put the repo root on sys.path for every pytest invocation, whatever the
# entry point or the layout of the directory being collected. The project is
# imported as top-level packages (agent, rag, store) rather than installed, so
# without this its importability depends on pytest's rootdir inference — which
# is what broke CI once already (see e2e/__init__.py).
pythonpath = ["."]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".github"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501", # line too long — handled by formatter
    "RUF001", "RUF002", "RUF003", # ambiguous string characters
    "E741", # ambiguous variable names
    "E402", # module level import not at top of file
    "E722", # bare except
    "SIM115", # open file without context manager
    # Compact one-liners (`if bad: print(...); return 1`) are a deliberate style
    # in the build and eval scripts, where a guard and its bail-out read better
    # on one line than spread over three. Not a defect class.
    "E701", "E702",
    # zip() without strict=. Every zip here walks parallel arrays returned
    # together by the same call (ChromaDB's ids/documents/metadatas, for
    # instance), so their lengths are equal by construction; strict=True would
    # add a runtime assertion for a condition the data model already guarantees.
    "B905",
]

[tool.ruff.lint.isort]
known-first-party = ["agent", "rag", "evaluation", "app_pages", "store", "skill_proficiency_estimator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
